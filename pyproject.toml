[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tidyflow"
version = "2.0.0"
description = "Robust, Universal AI File Organizer with Safe Operations, OCR, and Multi-Provider LLM Batching"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "pandas>=2.0.0",
    "Pillow>=10.0.0",
    "imagehash>=4.3.1",
    "rapidfuzz>=3.0.0",
    "pymupdf>=1.23.0",
    "httpx>=0.25.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "sse-starlette>=1.6.0",
    "python-dotenv>=1.0.0",
    "keyring>=24.0.0",
    "tqdm>=4.66.0",
]

[project.scripts]
tidy = "src.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
