input_dir: ./sample_data
output_dir: ./organized_output
staging_dir: ./organized_output/Staging
max_file_size_mb: 200.0
thumbnail_max_dim: 200
max_files: null
ocr:
  enabled: true
  languages:
  - en
  max_image_dimension: 768
  use_textline_orientation: false
  text_detection_model_name: PP-OCRv5_mobile_det
  text_recognition_model_name: en_PP-OCRv4_mobile_rec
  skip_images_smaller_than: 120
llm:
  enabled: true
  provider: deepseek
  api_base_url: https://api.deepseek.com/v1
  model: deepseek-chat
  batch_size: 15
  max_retries: 3
  timeout_seconds: 120
  custom_instructions: Prioritize sorting financial documents by type (Invoices, Receipts,
    Tax) and work documents by project or topic.
classification:
  auto_copy_threshold: 0.85
  heuristic_bypass_enabled: true
  heuristic_high_threshold: 88.0
  heuristic_low_second: 50.0
  default_category: Unknown
duplicates:
  hamming_distance_threshold: 8
categories:
  Screenshots:
    name: Screenshots
    description: All screenshot images, typically with names starting with 'Screenshot_'.
    keywords:
    - screenshot
    - screen capture
    - capture
    - image
    extensions:
    - .jpg
    - .jpeg
    - .png
    active: true
  Development:
    name: Development
    description: Source code, databases, and development tools including SQL files,
      archives, and installers.
    keywords:
    - sql
    - database
    - code
    - source
    - archive
    - installer
    - dmg
    - tar
    - gz
    - tbz2
    - zip
    extensions:
    - .sql
    - .zip
    - .gz
    - .dmg
    - .tbz2
    active: true
  Resumes:
    name: Resumes
    description: Resume and CV documents, typically PDFs with names containing 'Resume'
      or 'CV'.
    keywords:
    - resume
    - cv
    - curriculum vitae
    - job application
    extensions:
    - .pdf
    active: true
  Finance:
    name: Finance
    description: Financial documents such as payment receipts and invoices.
    keywords:
    - payment
    - receipt
    - invoice
    - bill
    - gateway
    extensions:
    - .pdf
    active: true
  Course_Reports:
    name: Course_Reports
    description: Course completion reports, learning reports, and related images or
      presentations.
    keywords:
    - course
    - completion
    - learning
    - report
    - react
    - aryan
    extensions:
    - .zip
    - .pptx
    - .jpeg
    - .jpg
    - .png
    active: true
