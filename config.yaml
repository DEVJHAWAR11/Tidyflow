input_dir: ./sample_data
output_dir: ./organized_output
staging_dir: ./organized_output/Staging
max_file_size_mb: 200.0
thumbnail_max_dim: 200
max_files: null
ocr:
  enabled: true
  languages:
  - en
  max_image_dimension: 768
  use_textline_orientation: false
  text_detection_model_name: PP-OCRv5_mobile_det
  text_recognition_model_name: en_PP-OCRv4_mobile_rec
  skip_images_smaller_than: 120
llm:
  enabled: true
  provider: deepseek
  api_base_url: https://api.deepseek.com/v1
  model: deepseek-chat
  batch_size: 15
  max_retries: 3
  timeout_seconds: 120
  custom_instructions: Prioritize sorting financial documents by type (Invoices, Receipts,
    Tax) and work documents by project or topic.
classification:
  auto_copy_threshold: 0.85
  heuristic_bypass_enabled: true
  heuristic_high_threshold: 88.0
  heuristic_low_second: 50.0
  default_category: Unknown
duplicates:
  hamming_distance_threshold: 8
categories:
  Academic:
    name: Academic
    description: Educational documents including mark sheets, admission letters, and
      certificates.
    keywords:
    - 10th
    - 12th
    - marksheet
    - admission
    - admit
    - degree
    - transcript
    - certificate
    extensions:
    - .pdf
    active: true
  Identity_and_Personal:
    name: Identity_and_Personal
    description: Personal identification documents and personal photos (e.g., Aadhaar,
      LinkedIn profile pictures).
    keywords:
    - aadhar
    - aadhaar
    - linkedin
    - photo
    - profile
    - id
    - papa
    - pic
    extensions:
    - .pdf
    - .png
    - .jpg
    active: true
  Financial_and_Loan:
    name: Financial_and_Loan
    description: Financial documents such as loan applications, fee certificates,
      and related paperwork.
    keywords:
    - loan
    - application
    - fee
    - certificate
    - vidyalaxmi
    - education loan
    - finance
    - payment
    extensions:
    - .pdf
    active: true
  General:
    name: General
    description: Miscellaneous files that don't fit into other categories, like shortcuts
      and system files.
    keywords:
    - desktop
    - zoom
    - shortcut
    - ini
    - lnk
    - misc
    - other
    - general
    extensions:
    - .ini
    - .lnk
    active: true
