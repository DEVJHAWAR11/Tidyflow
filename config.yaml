input_dir: ./sample_data
output_dir: ./organized_output
staging_dir: ./organized_output/Staging
max_file_size_mb: 200.0
thumbnail_max_dim: 200
max_files: null
ocr:
  enabled: true
  languages:
  - en
  max_image_dimension: 768
  use_textline_orientation: false
  text_detection_model_name: PP-OCRv5_mobile_det
  text_recognition_model_name: en_PP-OCRv4_mobile_rec
  skip_images_smaller_than: 120
llm:
  enabled: true
  provider: deepseek
  api_base_url: https://api.deepseek.com/v1
  model: deepseek-chat
  batch_size: 15
  max_retries: 3
  timeout_seconds: 120
  custom_instructions: Prioritize sorting financial documents by type (Invoices, Receipts,
    Tax) and work documents by project or topic.
classification:
  auto_copy_threshold: 0.85
  heuristic_bypass_enabled: true
  heuristic_high_threshold: 88.0
  heuristic_low_second: 50.0
  default_category: Unknown
duplicates:
  hamming_distance_threshold: 8
categories:
  Screenshots:
    name: Screenshots
    description: All screenshot images, typically with 'Screenshot' in the filename.
    keywords:
    - screenshot
    - screen
    - capture
    - image
    extensions:
    - .jpg
    - .jpeg
    - .png
    active: true
  Resumes:
    name: Resumes
    description: Resume and CV documents, often with 'resume' or 'cv' in the name.
    keywords:
    - resume
    - cv
    - curriculum
    - vitae
    extensions:
    - .pdf
    - .docx
    active: true
  Courses/React_JS:
    name: Courses/React_JS
    description: Course completion reports, learning materials, and related files
      for React JS.
    keywords:
    - react
    - js
    - course
    - completion
    - learning
    - report
    extensions:
    - .zip
    - .pptx
    - .jpeg
    - .jpg
    - .png
    - .pdf
    active: true
  Finance/Payments:
    name: Finance/Payments
    description: Payment receipts, invoices, and financial transaction documents.
    keywords:
    - payment
    - receipt
    - invoice
    - bill
    - gateway
    - response
    extensions:
    - .pdf
    active: true
  Development/Archives:
    name: Development/Archives
    description: Compressed archives and development-related files like tarballs and
      zip files.
    keywords:
    - archive
    - tar
    - gz
    - zip
    - compress
    - backup
    extensions:
    - .tar.gz
    - .gz
    - .zip
    - .tbz2
    active: true
  Development/Databases:
    name: Development/Databases
    description: Database schema files and SQL scripts.
    keywords:
    - sql
    - table
    - schema
    - database
    - query
    extensions:
    - .sql
    active: true
  Applications:
    name: Applications
    description: Installer files for software applications.
    keywords:
    - installer
    - dmg
    - app
    - setup
    extensions:
    - .dmg
    - .exe
    - .msi
    active: true
  Images:
    name: Images
    description: General image files that are not screenshots or course-related.
    keywords:
    - image
    - photo
    - picture
    - icon
    extensions:
    - .png
    - .jpg
    - .jpeg
    - .gif
    - .bmp
    active: true
