input_dir: ./sample_data
output_dir: ./organized_output
staging_dir: ./organized_output/Staging
max_file_size_mb: 200.0
thumbnail_max_dim: 200
max_files: null
ocr:
  enabled: true
  languages:
  - en
  max_image_dimension: 768
  use_textline_orientation: false
  text_detection_model_name: PP-OCRv5_mobile_det
  text_recognition_model_name: en_PP-OCRv4_mobile_rec
  skip_images_smaller_than: 120
llm:
  enabled: true
  provider: deepseek
  api_base_url: https://api.deepseek.com/v1
  model: deepseek-chat
  batch_size: 15
  max_retries: 3
  timeout_seconds: 120
  custom_instructions: Prioritize sorting financial documents by type (Invoices, Receipts,
    Tax) and work documents by project or topic.
classification:
  auto_copy_threshold: 0.85
  heuristic_bypass_enabled: true
  heuristic_high_threshold: 88.0
  heuristic_low_second: 50.0
  default_category: Unknown
duplicates:
  hamming_distance_threshold: 8
categories:
  Images/Screenshots:
    name: Images/Screenshots
    description: Screenshots captured from devices, typically with 'Screenshot' in
      the name.
    keywords:
    - screenshot
    - screen
    - capture
    - snapshot
    extensions:
    - .jpg
    - .jpeg
    - .png
    active: true
  Images/General:
    name: Images/General
    description: General image files like icons and other non-screenshot images.
    keywords:
    - icon
    - image
    - photo
    - picture
    extensions:
    - .png
    - .jpg
    - .jpeg
    - .gif
    - .bmp
    - .svg
    active: true
  Academic/Coursework:
    name: Academic/Coursework
    description: Course-related materials, reports, and assignments, such as the React
      JS course completion report.
    keywords:
    - react
    - course
    - completion
    - report
    - learning
    - aryan
    - singh
    extensions:
    - .zip
    - .pptx
    - .jpeg
    - .jpg
    - .pdf
    active: true
  Career/Resumes:
    name: Career/Resumes
    description: Resumes and CVs for job applications.
    keywords:
    - resume
    - cv
    - curriculum
    - vitae
    - arpan
    - singh
    extensions:
    - .pdf
    - .doc
    - .docx
    active: true
  Finance/Receipts:
    name: Finance/Receipts
    description: Payment receipts, invoices, and financial documents.
    keywords:
    - payment
    - receipt
    - invoice
    - bill
    - gateway
    - kiit
    extensions:
    - .pdf
    active: true
  Archives:
    name: Archives
    description: Compressed archives and installer files.
    keywords:
    - archive
    - compressed
    - installer
    - dmg
    - tar
    - zip
    - tbz2
    - gz
    extensions:
    - .zip
    - .tar
    - .gz
    - .tbz2
    - .dmg
    - .rar
    - .7z
    active: true
  Development/Databases:
    name: Development/Databases
    description: Database scripts and schema files.
    keywords:
    - sql
    - table
    - schema
    - database
    - query
    extensions:
    - .sql
    active: true
